name: Build Kernel

on:
  push:
    branches:
      - ci
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner label to use for the build job'
        required: false
        default: ''
  schedule:
    - cron: "0 1 * * *" # Every day at 01:00 am UTC

env:
  CUSTOM_KERNEL_CONFIG: |
    # Custom kernel configuration options
    CONFIG_LOCALVERSION="-sybit-custom-WSL2"
  DEBIAN_FRONTEND: noninteractive

jobs:
  prepare:
    runs-on: ${{ github.event.inputs.runner || 'ubuntu-latest' }}
    outputs:
      matrix: ${{ steps.merge.outputs.matrix }}
      runner-cores: ${{ steps.runner-info.outputs.cores }}

    steps:
      - name: Gather available branches from microsoft/WSL2-Linux-Kernel
        id: microsoft-branches
        run: |
          mkdir -p WSL2-Linux-Kernel
          cd WSL2-Linux-Kernel
          git init
          git remote add origin https://github.com/microsoft/WSL2-Linux-Kernel.git

          # Get remote braches that start with "linux-msft-wsl-"
          branches=$(git ls-remote --heads origin | grep -o 'refs/heads/linux-msft-wsl-[0-9]*\.[0-9]*\.[0-9]*.*' | sed 's|refs/heads/||')
          json=$(echo "$branches" | jq -R . | jq -s .)
          echo "==> Available branches: $json"

          # Filter old kernels we don't need 4.19, 5.4, 5.10, 5.15, 6.1
          branches=$(echo "$branches" | grep -vE '^(linux-msft-wsl-(4\.19|5\.4|5\.10|5\.15|6\.1)\.)')
          branches=$(echo "$branches" | sort -V)

          # Convert to JSON array
          json=$(echo "$branches" | jq -R . | jq -cs '. | map({ "repo": "microsoft/WSL2-Linux-Kernel", "kconfig": "Microsoft/config-wsl", "branch": . })')
          echo "==> Selected branches: $(echo $json | jq)"

          echo "branches=$json" >> $GITHUB_OUTPUT
      
      - name: Gather available branches from Nevuly/WSL2-Linux-Kernel-Rolling-LTS
        id: rolling-lts-branches
        run: |
          mkdir -p WSL2-Linux-Kernel-Rolling-LTS
          cd WSL2-Linux-Kernel-Rolling-LTS
          git init
          git remote add origin https://github.com/Nevuly/WSL2-Linux-Kernel-Rolling-LTS.git

          # Get remote braches that start with "wsl-"
          branches=$(git ls-remote --heads origin | grep -o 'refs/heads/wsl-[0-9]*\.[0-9]*.*-lts$' | sed 's|refs/heads/||')
          json=$(echo "$branches" | jq -R . | jq -cs '. | map({ "repo": "Nevuly/WSL2-Linux-Kernel-Rolling-LTS", "branch": . })')
          echo "==> Available branches: $json"

          branches=$(echo "$branches" | sort -V)

          # Convert to JSON array
          json=$(echo "$branches" | jq -R . | jq -cs '. | map({ "repo": "Nevuly/WSL2-Linux-Kernel-Rolling-LTS", "kconfig": "arch/x86/configs/config-wsl-x86", "branch": . })')
          echo "==> Selected branches: $(echo $json | jq)"

          echo "branches=$json" >> $GITHUB_OUTPUT
      
      - name: Gather available branches from Nevuly/WSL2-Linux-Kernel-Rolling
        id: rolling-stable-branches
        run: |
          mkdir -p WSL2-Linux-Kernel-Rolling
          cd WSL2-Linux-Kernel-Rolling
          git init
          git remote add origin https://github.com/Nevuly/WSL2-Linux-Kernel-Rolling.git

          # Get remote braches that start with "wsl-"
          branches=$(git ls-remote --heads origin | grep -o 'refs/heads/wsl-[0-9]*\.[0-9]*.*-rolling$' | sed 's|refs/heads/||')
          json=$(echo "$branches" | jq -R . | jq -cs .)
          echo "==> Available branches: $json"

          branches=$(echo "$branches" | sort -V)

          # Convert to JSON array
          json=$(echo "$branches" | jq -R . | jq -cs '. | map({ "repo": "Nevuly/WSL2-Linux-Kernel-Rolling", "kconfig": "arch/x86/configs/config-wsl-x86", "branch": . })')
          echo "==> Selected branches: $(echo $json | jq)"

          echo "branches=$json" >> $GITHUB_OUTPUT
      
      - name: Merge branches for matrix
        id: merge
        run: |
          ms_branches='${{ steps.microsoft-branches.outputs.branches }}'
          lts_branches='${{ steps.rolling-lts-branches.outputs.branches }}'
          stable_branches='${{ steps.rolling-stable-branches.outputs.branches }}'
          merged_json=$(jq -cs 'add | { "include": . }' <<< "$ms_branches $lts_branches $stable_branches")
          echo "==> Merged branches: $merged_json"
          echo "matrix=$merged_json" >> $GITHUB_OUTPUT
          rm -rf WSL2-Linux-Kernel*

      - name: Remove /opt/hostedtoolcache from GitHub runner
        if: github.event.inputs.runner == ''
        run: |
          sudo rm -rf /opt/hostedtoolcache
      
      - name: Get runner CPU cores
        id: runner-info
        run: |
          CORES=$(nproc)
          echo "Runner has $CORES CPU cores"
          echo "cores=$CORES" >> $GITHUB_OUTPUT

  build:
    needs: prepare
    runs-on: ${{ github.event.inputs.runner || 'ubuntu-latest' }}
    container:
      image: ubuntu:24.04
      options: --privileged

    strategy:
      fail-fast: false
      max-parallel: ${{ fromJson(vars.MATRIX_PARALLEL_JOBS || 2) }}
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}

    steps:
      - name: Install dependencies
        run: |
          echo "==> Installing dependencies for github cli"
          apt-get update
          apt-get install -y wget ca-certificates gnupg
          mkdir -p -m 755 /etc/apt/keyrings
          out=$(mktemp) && wget -nv -O$out https://cli.github.com/packages/githubcli-archive-keyring.gpg
          cat $out | tee /etc/apt/keyrings/githubcli-archive-keyring.gpg > /dev/null
          chmod go+r /etc/apt/keyrings/githubcli-archive-keyring.gpg
          mkdir -p -m 755 /etc/apt/sources.list.d
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | tee /etc/apt/sources.list.d/github-cli.list > /dev/null

          echo "==> Installing build dependencies"
          apt-get update
          apt-get install -y build-essential flex bison dwarves libssl-dev libelf-dev cpio qemu-utils ccache jq bc curl gh python3 zstd zip git git-lfs

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repo }}
          ref: ${{ matrix.branch }}
          fetch-depth: 1

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: |
            .cache/ccache
          key: ${{ runner.os }}-ccache-${{ matrix.repo }}-${{ matrix.branch }}-${{ hashFiles('**/*.c', '**/*.h', 'Makefile', '**/Makefile') }}
          restore-keys: |
            ${{ runner.os }}-ccache-${{ matrix.repo }}-${{ matrix.branch }}-
            ${{ runner.os }}-ccache-${{ matrix.repo }}-

      - name: Setup ccache
        run: |
          mkdir -p "$PWD/.cache/"
          echo "/usr/lib/ccache" >> $GITHUB_PATH
          ccache --set-config=cache_dir=$PWD/.cache/ccache
          ccache --set-config=max_size=3G
          ccache --set-config=compression=true
          ccache --set-config=stats=true
          ccache --set-config=log_file=$PWD/.cache/ccache.log
          ccache --zero-stats
          echo "==> Initial ccache stats:"
          ccache --show-stats --verbose

      - name: Verify kernel configuration exists
        run: |
          if [ ! -f "${{ matrix.kconfig }}" ]; then
            echo "Error: Kernel config file ${{ matrix.kconfig }} not found"
            exit 1
          fi
          echo "==> Using kernel config: ${{ matrix.kconfig }}"
          echo "==> Custom kernel config: $CUSTOM_KERNEL_CONFIG"
          echo "$CUSTOM_KERNEL_CONFIG" >> ${{ matrix.kconfig }}
          echo "==> Kernel config after modification:"
          cat ${{ matrix.kconfig }}

      - name: Build kernel
        id: build-kernel
        run: |
          time_start=$(date +%s)
          echo "==> Starting kernel build with ${{ needs.prepare.outputs.runner-cores }} parallel threads"

          # Build kernel with parallel jobs and ccache
          make KCONFIG_CONFIG=${{ matrix.kconfig }} -j$(echo "${{ needs.prepare.outputs.runner-cores }} / ${{ vars.MATRIX_PARALLEL_JOBS || 2 }}" | bc)

          # Install modules to local directory
          make KCONFIG_CONFIG=${{ matrix.kconfig }} INSTALL_MOD_PATH="$PWD/modules" modules_install
          time_end=$(date +%s)
          time_taken=$((time_end - time_start))
          echo "==> Kernel build completed in $((time_taken / 60)) minutes and $((time_taken % 60)) seconds"
          echo "time_summary=$((time_taken / 60)) min $((time_taken % 60)) sec" >> $GITHUB_OUTPUT

      - name: Get kernel release version
        id: kernel-version
        run: |
          KERNEL_RELEASE=$(make -s kernelrelease)
          # Strip -sybit-* from the version
          STRIPPED_VERSION=$(echo "$KERNEL_RELEASE" | sed 's/-sybit-.*//')

          echo "release=$KERNEL_RELEASE" >> $GITHUB_OUTPUT
          echo "version=$STRIPPED_VERSION" >> $GITHUB_OUTPUT
          echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
          echo "ref=$(git rev-parse --abbrev-ref HEAD)" >> $GITHUB_OUTPUT
          echo "==> Kernel version: $KERNEL_RELEASE"

      - name: Create modules VHDX
        run: |
          MODULE_DIR="$PWD/modules/lib/modules/${{ steps.kernel-version.outputs.release }}"
          # Check if we have any .ko files
          if ! find "$MODULE_DIR" -name "*.ko" | grep -q .; then
            echo "==> No kernel modules found - skipping VHDX creation"
            exit 0
          fi

          # Calculate modules size (+ 256MiB for slack)
          modules_size=$(du -bs "$PWD/modules" | awk '{print $1;}')
          modules_size=$((modules_size + (256*(1<<20))))

          # Create temporary directory
          tmp_dir=$(mktemp -d)

          echo "==> Creating blank image of size $modules_size bytes"
          dd if=/dev/zero of="$tmp_dir/modules.img" bs=1024 count=$((modules_size / 1024))

          echo "==> Setting up loopback device and filesystem"
          lo_dev=$(losetup --find --show "$tmp_dir/modules.img")
          mkfs -t ext4 "$lo_dev"

          echo "==> Mounting and copying modules"
          mkdir -p "$tmp_dir/modules_img"
          mount "$lo_dev" "$tmp_dir/modules_img"
          chmod a+rw "$tmp_dir/modules_img"

          # Copy modules
          cp -rv "$MODULE_DIR"/* "$tmp_dir/modules_img/"

          echo "==> Unmounting and converting to VHDX"
          umount "$tmp_dir/modules_img"
          losetup -d "$lo_dev"

          # Convert to VHDX
          qemu-img convert -O vhdx "$tmp_dir/modules.img" modules.vhdx
          chmod 644 modules.vhdx

          # Cleanup
          rm -rf "$tmp_dir"

      - name: Prepare and zip release assets
        id: prepare-assets
        run: |
          # Create artifacts directory
          mkdir -p artifacts

          # Move built kernel
          mv -v arch/x86/boot/bzImage artifacts/bzImage-${{ steps.kernel-version.outputs.version }}

          if [ -f modules.vhdx ]; then
            # Move modules VHDX
            mv -v modules.vhdx artifacts/modules-${{ steps.kernel-version.outputs.version }}.vhdx
          fi

          # Copy kernel config
          cp -v ${{ matrix.kconfig }} artifacts/config-${{ steps.kernel-version.outputs.release }}

          # Create build summary for release description
          cat > build-summary.md << EOF
          ## Build Summary

          - **Kernel Version**: ${{ steps.kernel-version.outputs.release }}
          - **Build Date**: $(date -u '+%Y-%m-%d %H:%M:%S UTC')
          - **Git Commit**: ${{ steps.kernel-version.outputs.sha }}
          - **Git Branch**: ${{ steps.kernel-version.outputs.ref }}
          - **Workflow Run**: [${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

          ### Build Performance
          \`\`\`
          $(ccache --show-stats)
          \`\`\`

          Build time: ${{ steps.build-kernel.outputs.time_summary }}

          ### System Information
          - **CPU**: $(lscpu | grep "Model name") (${{ needs.prepare.outputs.runner-cores }} cores)
          - **Memory**: $(free -h | grep Mem | awk '{print $2}')B

          ### Assets Included
          - \`bzImage-${{ steps.kernel-version.outputs.version }}\`: Compiled kernel image
          $(if [ -f "modules.vhdx" ]; then echo "- \`modules-${{ steps.kernel-version.outputs.version }}.vhdx\`: Kernel modules in VHDX format"; fi)
          - \`config-${{ steps.kernel-version.outputs.release }}\`: Build configuration used

          ## Installation

          Use the automated PowerShell installer:

          \`\`\`powershell
          Set-ExecutionPolicy Bypass -Scope Process -Force; [System.Net.ServicePointManager]::SecurityProtocol = [System.Net.ServicePointManager]::SecurityProtocol -bor 3072; iex ((New-Object System.Net.WebClient).DownloadString('https://raw.githubusercontent.com/${{ github.repository }}/ci/Install-WSL2Kernel.ps1'))
          \`\`\`

          Or download and extract the zip file manually to \`%USERPROFILE%\\wsl\\kernels\` and update your \`.wslconfig\`.
          EOF

          # Create build info for the zip
          cat > artifacts/build-info.txt << EOF
          Build Date: $(date -u '+%Y-%m-%d %H:%M:%S UTC')
          Kernel Version: ${{ steps.kernel-version.outputs.release }}
          Git Commit: ${{ steps.kernel-version.outputs.sha }}
          Git Ref: ${{ steps.kernel-version.outputs.ref }}
          Workflow Run: ${{ github.run_number }}
          Workflow URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          
          System Info:
          CPU: $(lscpu | grep "Model name") (${{ needs.prepare.outputs.runner-cores }} cores)
          Memory: $(free -h | grep Mem | awk '{print $2}')B

          ccache Stats:
          $(ccache --show-stats --verbose)

          ccache Debug Log (last 20 lines):
          $(tail -n 20 .cache/ccache.log 2>/dev/null || echo "No debug log available")
          EOF

          # List artifacts
          ls -la artifacts/

          # Create zip file with all assets
          cd artifacts
          zip -r "../wsl2-kernel-${{ steps.kernel-version.outputs.version }}.zip" .
          cd ..

          # List what we created
          echo "==> Created zip file:"
          ls -la wsl2-kernel-${{ steps.kernel-version.outputs.version }}.zip
          echo "==> Zip contents:"
          unzip -l wsl2-kernel-${{ steps.kernel-version.outputs.version }}.zip
          
          echo "zip_file=wsl2-kernel-${{ steps.kernel-version.outputs.version }}.zip" >> $GITHUB_OUTPUT

          # Cleanup to save space on the runner
          rm -rf artifacts/ modules/

      - name: Checkout own repository for release
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          path: release-repo

      - name: Create kernel version release
        id: create-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd release-repo
          
          RELEASE_TAG="${{ steps.kernel-version.outputs.version }}"
          RELEASE_NAME="linux-msft-wsl-${{ steps.kernel-version.outputs.version }}"
          
          echo "==> Creating release: $RELEASE_NAME with tag: $RELEASE_TAG"
          
          # Check if release already exists and delete it if it does
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "==> Release $RELEASE_TAG already exists, deleting it first"
            gh release delete "$RELEASE_TAG" --yes
          fi
          
          # Create new release with build summary as description
          gh release create "$RELEASE_TAG" \
            "../${{ steps.prepare-assets.outputs.zip_file }}" \
            --title "$RELEASE_NAME" \
            --notes-file "../build-summary.md"
          
          echo "==> Release created successfully"
          echo "release_tag=$RELEASE_TAG" >> $GITHUB_OUTPUT
          echo "release_name=$RELEASE_NAME" >> $GITHUB_OUTPUT
          
          # Cleanup release zip
          rm -f "../${{ steps.prepare-assets.outputs.zip_file }}"

      - name: Build summary
        run: |
          echo "## Build Summary ${{ steps.kernel-version.outputs.release }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Kernel Version**: ${{ steps.kernel-version.outputs.release }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Build Date**: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ steps.kernel-version.outputs.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ steps.kernel-version.outputs.ref }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Release**: [${{ steps.create-release.outputs.release_name }}](https://github.com/${{ github.repository }}/releases/tag/${{ steps.create-release.outputs.release_tag }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Build Performance" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          ccache --show-stats >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "Build time: ${{ steps.build-kernel.outputs.time_summary }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Release Asset" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ steps.prepare-assets.outputs.zip_file }}\`: Complete kernel package containing:" >> $GITHUB_STEP_SUMMARY
          echo "  - \`bzImage-${{ steps.kernel-version.outputs.version }}\`: Compiled kernel image" >> $GITHUB_STEP_SUMMARY
          if [ -f "artifacts/modules-${{ steps.kernel-version.outputs.version }}.vhdx" ]; then
            echo "  - \`modules-${{ steps.kernel-version.outputs.version }}.vhdx\`: Kernel modules in VHDX format" >> $GITHUB_STEP_SUMMARY
          fi
          echo "  - \`config-${{ steps.kernel-version.outputs.release }}\`: Build configuration used" >> $GITHUB_STEP_SUMMARY
          echo "  - \`build-info.txt\`: Build metadata" >> $GITHUB_STEP_SUMMARY
          echo "## Installation command" >> $GITHUB_STEP_SUMMARY
          echo '```powershell' >> $GITHUB_STEP_SUMMARY
          echo 'Set-ExecutionPolicy Bypass -Scope Process -Force; [System.Net.ServicePointManager]::SecurityProtocol = [System.Net.ServicePointManager]::SecurityProtocol -bor 3072; iex ((New-Object System.Net.WebClient).DownloadString('"'https://raw.githubusercontent.com/${{ github.repository }}/ci/Install-WSL2Kernel.ps1'"'))' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
