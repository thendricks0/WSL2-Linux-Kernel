name: Build & Publish Kernels

on:
  push:
    branches:
      - ci
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner label to use for the build job'
        required: false
        default: ''
  schedule:
    - cron: "0 1 * * *" # Every day at 01:00 am UTC

env:
  CUSTOM_KERNEL_CONFIG: |
    # Custom kernel configuration options
    CONFIG_LOCALVERSION="-sybit-custom-WSL2"
  DEBIAN_FRONTEND: noninteractive

jobs:
  check-runner:
    runs-on: ubuntu-latest
    outputs:
      runner: ${{ steps.pick.outputs.runner }}
    steps:
      - name: Determine target runner
        id: pick
        env:
          GH_TOKEN: ${{ secrets.RUNNER_PAT }}
          RUNNER_LABEL: "self-hosted"
        run: |
          # If a runner was explicitly specified via workflow_dispatch, use it
          MANUAL_RUNNER="${{ github.event.inputs.runner }}"
          if [ -n "$MANUAL_RUNNER" ]; then
            echo "==> Manual runner override: $MANUAL_RUNNER"
            echo "runner=$MANUAL_RUNNER" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Query the GitHub Runners API to check if any self-hosted runner is online
          RESPONSE=$(curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runners" 2>&1) || {
            echo "==> API call failed: $RESPONSE"
            echo "==> Falling back to ubuntu-latest"
            echo "runner=ubuntu-latest" >> "$GITHUB_OUTPUT"
            exit 0
          }

          # Check if any runner with the self-hosted label is online
          ONLINE_COUNT=$(echo "$RESPONSE" | jq '[.runners[] | select(.status == "online")] | length')
          echo "==> Online self-hosted runners: $ONLINE_COUNT"

          if [ "$ONLINE_COUNT" -gt 0 ]; then
            RUNNER_NAME=$(echo "$RESPONSE" | jq -r '[.runners[] | select(.status == "online")][0].name')
            echo "==> Self-hosted runner '$RUNNER_NAME' is online, using self-hosted"
            echo "runner=self-hosted" >> "$GITHUB_OUTPUT"
          else
            echo "==> No self-hosted runners online, falling back to ubuntu-latest"
            echo "runner=ubuntu-latest" >> "$GITHUB_OUTPUT"
          fi

  prepare:
    needs: [check-runner]
    runs-on: ${{ needs.check-runner.outputs.runner }}
    outputs:
      matrix: ${{ steps.merge.outputs.matrix }}
      runner-cores: ${{ steps.runner-info.outputs.cores }}
      selected-runner: ${{ needs.check-runner.outputs.runner }}

    steps:
      - name: Configure Bandwidth Limit
        if: ${{ needs.check-runner.outputs.runner == 'self-hosted' }}
        run: |
          current_day=$(date +%u)
          current_hour=$(date +%H)
          IFACE=$(ip route | awk '/default/ { print $5 }')
          
          echo "==> Interface: $IFACE"
          
          # Function to apply limit
          apply_limit() {
              if ! command -v tc >/dev/null 2>&1; then
                  echo "==> installing tc (iproute2)"
                  sudo apt-get update && sudo apt-get install -y iproute2
              fi

              echo "==> Applying 5Mbps limit on $IFACE"
              # Remove existing
              sudo tc qdisc del dev "$IFACE" root 2>/dev/null || true

              # Use HTB + fq_codel. This is the industry standard for preventing bufferbloat.
              # It rate-limits the link but ensures interactive traffic (SSH/Runner) gets priority
              # over bulk uploads, preventing the "stuck" connection issues.
              
              # 1. Root HTB
              sudo tc qdisc add dev "$IFACE" root handle 1: htb default 10
              
              # 2. Rate Limit Class
              # burst=256k is critical for GSO/offload support (avoiding immediate drops)
              sudo tc class add dev "$IFACE" parent 1: classid 1:10 htb rate 5mbit ceil 5mbit burst 256k cburst 256k
              
              # 3. Leaf qdisc: fq_codel (Fair Queueing with Controlled Delay)
              # limit 2000: Provides deep buffer (~3MB) to absorb existing TCP flight (prevent drops)
              # But fq_codel internals prevent this buffer from blocking control traffic.
              sudo tc qdisc add dev "$IFACE" parent 1:10 fq_codel limit 2000 quantum 1514
          }
          
          # Function to remove limit
          remove_limit() {
              echo "==> Removing limits on $IFACE"
              sudo tc qdisc del dev "$IFACE" root 2>/dev/null || true
          }

          if [ "$current_day" -ge 1 ] && [ "$current_day" -le 5 ] && [ "$current_hour" -ge 7 ] && [ "$current_hour" -lt 18 ]; then
               echo "==> Work hours detected (Mon-Fri 07:00-18:00)."
               apply_limit || echo "==> Failed to apply bandwidth limit, continuing anyway."
          else
               echo "==> Outside work hours."
               remove_limit || echo "==> No limits to remove or failed to remove, ignoring."
          fi

      - name: Gather available branches from microsoft/WSL2-Linux-Kernel
        id: microsoft-branches
        run: |
          mkdir -p WSL2-Linux-Kernel
          cd WSL2-Linux-Kernel
          git init
          git remote add origin https://github.com/microsoft/WSL2-Linux-Kernel.git

          # Get remote braches that start with "linux-msft-wsl-"
          branches=$(git ls-remote --heads origin | grep -o 'refs/heads/linux-msft-wsl-[0-9]*\.[0-9]*\.[0-9]*.*' | sed 's|refs/heads/||')
          json=$(echo "$branches" | jq -R . | jq -s .)
          echo "==> Available branches: $json"

          # Filter old kernels we don't need 4.19, 5.4, 5.10, 5.15, 6.1
          branches=$(echo "$branches" | grep -vE '^(linux-msft-wsl-(4\.19|5\.4|5\.10|5\.15|6\.1)\.)')
          branches=$(echo "$branches" | sort -V)

          # Convert to JSON array
          json=$(echo "$branches" | jq -R . | jq -cs '. | map({ "repo": "microsoft/WSL2-Linux-Kernel", "kconfig": "Microsoft/config-wsl", "branch": . })')
          echo "==> Selected branches: $(echo $json | jq)"

          echo "branches=$json" >> $GITHUB_OUTPUT
      
      - name: Gather available branches from Nevuly/WSL2-Linux-Kernel-Rolling-LTS
        id: rolling-lts-branches
        run: |
          mkdir -p WSL2-Linux-Kernel-Rolling-LTS
          cd WSL2-Linux-Kernel-Rolling-LTS
          git init
          git remote add origin https://github.com/Nevuly/WSL2-Linux-Kernel-Rolling-LTS.git

          # Get remote braches that start with "wsl-"
          branches=$(git ls-remote --heads origin | grep -o 'refs/heads/wsl-[0-9]*\.[0-9]*.*-lts$' | sed 's|refs/heads/||')
          json=$(echo "$branches" | jq -R . | jq -cs '. | map({ "repo": "Nevuly/WSL2-Linux-Kernel-Rolling-LTS", "branch": . })')
          echo "==> Available branches: $json"

          branches=$(echo "$branches" | sort -V)

          # Convert to JSON array
          json=$(echo "$branches" | jq -R . | jq -cs '. | map({ "repo": "Nevuly/WSL2-Linux-Kernel-Rolling-LTS", "kconfig": "arch/x86/configs/config-wsl-x86", "branch": . })')
          echo "==> Selected branches: $(echo $json | jq)"

          echo "branches=$json" >> $GITHUB_OUTPUT
      
      - name: Gather available branches from Nevuly/WSL2-Linux-Kernel-Rolling
        id: rolling-stable-branches
        run: |
          mkdir -p WSL2-Linux-Kernel-Rolling
          cd WSL2-Linux-Kernel-Rolling
          git init
          git remote add origin https://github.com/Nevuly/WSL2-Linux-Kernel-Rolling.git

          # Get remote braches that start with "wsl-"
          branches=$(git ls-remote --heads origin | grep -o 'refs/heads/wsl-[0-9]*\.[0-9]*.*-rolling$' | sed 's|refs/heads/||')
          json=$(echo "$branches" | jq -R . | jq -cs .)
          echo "==> Available branches: $json"

          branches=$(echo "$branches" | sort -V)

          # Convert to JSON array
          json=$(echo "$branches" | jq -R . | jq -cs '. | map({ "repo": "Nevuly/WSL2-Linux-Kernel-Rolling", "kconfig": "arch/x86/configs/config-wsl-x86", "branch": . })')
          echo "==> Selected branches: $(echo $json | jq)"

          echo "branches=$json" >> $GITHUB_OUTPUT
      
      - name: Merge branches for matrix
        id: merge
        run: |
          ms_branches='${{ steps.microsoft-branches.outputs.branches }}'
          lts_branches='${{ steps.rolling-lts-branches.outputs.branches }}'
          stable_branches='${{ steps.rolling-stable-branches.outputs.branches }}'
          merged_json=$(jq -cs 'add | sort_by(.branch) | { "include": . }' <<< "$ms_branches $lts_branches $stable_branches")
          echo "==> Merged branches: $merged_json"
          echo "matrix=$merged_json" >> $GITHUB_OUTPUT
          rm -rf WSL2-Linux-Kernel*

      - name: Get runner CPU cores
        id: runner-info
        run: |
          CORES=$(nproc)
          echo "Runner has $CORES CPU cores"
          echo "cores=$CORES" >> $GITHUB_OUTPUT

      - name: Aggressive cleanup
        run: |
          # Remove Java (JDKs)
          sudo rm -rf /usr/lib/jvm || true

          # Remove .NET SDKs
          sudo rm -rf /usr/share/dotnet || true

          # Remove Swift toolchain
          sudo rm -rf /usr/share/swift || true

          # Remove Haskell (GHC)
          sudo rm -rf /usr/local/.ghcup || true

          # Remove Julia
          sudo rm -rf /usr/local/julia* || true

          # Remove Android SDKs
          sudo rm -rf /usr/local/lib/android || true

          # Remove Chromium (optional if not using for browser tests)
          sudo rm -rf /usr/local/share/chromium || true

          # Remove Microsoft/Edge and Google Chrome builds
          sudo rm -rf /opt/microsoft /opt/google || true

          # Remove Azure CLI
          sudo rm -rf /opt/az || true

          # Remove PowerShell
          sudo rm -rf /usr/local/share/powershell || true

          # Remove CodeQL and other toolcaches
          sudo rm -rf /opt/hostedtoolcache || true

          docker system prune -af || true
          docker builder prune -af || true
          df -h

  build:
    needs: prepare
    if: always() && (needs.prepare.result == 'success')
    runs-on: ${{ needs.prepare.outputs.selected-runner }}
    container:
      image: ubuntu:24.04
      options: --privileged

    strategy:
      fail-fast: false
      max-parallel: ${{ fromJson(vars.MATRIX_PARALLEL_JOBS || 2) }}
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}

    steps:
      - name: Install dependencies
        run: |
          echo "==> Installing dependencies for github cli"
          apt-get update
          apt-get install -y wget ca-certificates gnupg
          mkdir -p -m 755 /etc/apt/keyrings
          out=$(mktemp) && wget -nv -O$out https://cli.github.com/packages/githubcli-archive-keyring.gpg
          cat $out | tee /etc/apt/keyrings/githubcli-archive-keyring.gpg > /dev/null
          chmod go+r /etc/apt/keyrings/githubcli-archive-keyring.gpg
          mkdir -p -m 755 /etc/apt/sources.list.d
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | tee /etc/apt/sources.list.d/github-cli.list > /dev/null

          echo "==> Installing kernel-check dependencies"
          apt-get update
          apt-get install -y gh make git git-lfs

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repo }}
          ref: ${{ matrix.branch }}
          fetch-depth: 1

      - name: Verify kernel configuration exists
        id: verify-config
        run: |
          if [ ! -f "${{ matrix.kconfig }}" ]; then
            echo "Error: Kernel config file ${{ matrix.kconfig }} not found, defaulting to x86_64_defconfig, this will be a prerelease!"
            cp -v arch/x86/configs/x86_64_defconfig ${{ matrix.kconfig }}
            echo "prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "prerelease=false" >> $GITHUB_OUTPUT
          fi
          echo "==> Using kernel config: ${{ matrix.kconfig }}"
          echo "==> Custom kernel config: $CUSTOM_KERNEL_CONFIG"
          echo "$CUSTOM_KERNEL_CONFIG" >> ${{ matrix.kconfig }}
          echo "==> Kernel config after modification:"
          cat ${{ matrix.kconfig }}
      
      - name: Check if kernel version already released
        id: check-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Get kernel version that would be built
          KERNEL_VERSION=$(make KCONFIG_CONFIG=${{ matrix.kconfig }} -s kernelversion)
          
          echo "==> Kernel version would be: $KERNEL_VERSION"
          echo "==> Release tag would be: $KERNEL_VERSION"

          # Check if release exists
          if gh release view "$KERNEL_VERSION" --repo ${{ github.repository }} >/dev/null 2>&1; then
            echo "==> ✅ Release $KERNEL_VERSION already exists, skipping build"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "==> 🔨 Release $KERNEL_VERSION does not exist, will build"
            echo "skip=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Install build dependencies
        if: steps.check-release.outputs.skip != 'true'
        run: |
          echo "==> Installing build dependencies"
          apt-get update
          apt-get install -y build-essential flex bison dwarves libssl-dev libelf-dev cpio qemu-utils ccache jq bc curl gh python3 zstd zip git git-lfs

      - name: Cache ccache
        if: steps.check-release.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: |
            .cache/ccache
          key: ${{ runner.os }}-ccache-${{ matrix.repo }}-${{ matrix.branch }}-${{ hashFiles('**/*.c', '**/*.h', 'Makefile', '**/Makefile') }}
          restore-keys: |
            ${{ runner.os }}-ccache-${{ matrix.repo }}-${{ matrix.branch }}-
            ${{ runner.os }}-ccache-${{ matrix.repo }}-

      - name: Setup ccache
        if: steps.check-release.outputs.skip != 'true'
        run: |
          mkdir -p "$PWD/.cache/"
          echo "/usr/lib/ccache" >> $GITHUB_PATH
          ccache --set-config=cache_dir=$PWD/.cache/ccache
          ccache --set-config=max_size=3G
          ccache --set-config=compression=true
          ccache --set-config=stats=true
          ccache --set-config=log_file=$PWD/.cache/ccache.log
          ccache --zero-stats
          echo "==> Initial ccache stats:"
          ccache --show-stats --verbose

      - name: Build kernel
        if: steps.check-release.outputs.skip != 'true'
        id: build-kernel
        run: |
          time_start=$(date +%s)
          echo "==> Starting kernel build with ${{ needs.prepare.outputs.runner-cores }} parallel threads"

          # Build kernel with parallel jobs and ccache
          JOBS=$(echo "${{ needs.prepare.outputs.runner-cores }} / ${{ vars.MATRIX_PARALLEL_JOBS || 2 }}" | bc)
          if ! make KCONFIG_CONFIG=${{ matrix.kconfig }} -j$JOBS; then
              echo "==> Kernel build failed with -j$JOBS, potential OOM. Retrying with -j1..."
              make KCONFIG_CONFIG=${{ matrix.kconfig }} -j1 || {
                  echo "==> Kernel build failed again!"
                  echo "Current disk space usage:"
                  df -h
                  echo "Current directory space usage:"
                  du -shc $PWD/*
                  exit 1
              }
          fi
          time_kernel_built=$(date +%s)
          echo "==> Kernel build succeeded! (took $((time_kernel_built - time_start)) seconds)"

          echo "==> Installing modules..."
          # Install modules to local directory
          make KCONFIG_CONFIG=${{ matrix.kconfig }} INSTALL_MOD_PATH="$PWD/modules" modules_install || {
              echo "==> Module installation failed!"
              echo "Current disk space usage:"
              df -h
              echo "Current directory space usage:"
              du -shc $PWD/*
              exit 1
          }
          time_modules_installed=$(date +%s)
          echo "==> Module installation succeeded! (took $((time_modules_installed - time_kernel_built)) seconds)"
          time_end=$(date +%s)
          time_taken=$((time_end - time_start))
          echo "==> Kernel build completed in $((time_taken / 60)) minutes and $((time_taken % 60)) seconds"
          echo "time_summary=$((time_taken / 60)) min $((time_taken % 60)) sec" >> $GITHUB_OUTPUT

      - name: Get kernel release version
        if: steps.check-release.outputs.skip != 'true'
        id: kernel-version
        run: |
          KERNEL_RELEASE=$(make KCONFIG_CONFIG=${{ matrix.kconfig }} -s kernelrelease)
          KERNEL_VERSION=$(make KCONFIG_CONFIG=${{ matrix.kconfig }} -s kernelversion)

          git config --global --add safe.directory "$PWD"

          echo "release=$KERNEL_RELEASE" >> $GITHUB_OUTPUT
          echo "version=$KERNEL_VERSION" >> $GITHUB_OUTPUT
          echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
          echo "ref=$(git rev-parse --abbrev-ref HEAD)" >> $GITHUB_OUTPUT
          echo "==> Kernel version: $KERNEL_RELEASE"

      - name: Create modules VHDX
        if: steps.check-release.outputs.skip != 'true'
        run: |
          MODULE_DIR="$PWD/modules/lib/modules/${{ steps.kernel-version.outputs.release }}"
          # Check if we have any .ko files
          if ! find "$MODULE_DIR" -name "*.ko" | grep -q .; then
            echo "==> No kernel modules found - skipping VHDX creation"
            exit 0
          fi

          # Calculate modules size (+ 256MiB for slack)
          modules_size=$(du -bs "$PWD/modules" | awk '{print $1;}')
          modules_size=$((modules_size + (256*(1<<20))))

          # Create temporary directory
          tmp_dir=$(mktemp -d)

          echo "==> Creating blank image of size $modules_size bytes"
          dd if=/dev/zero of="$tmp_dir/modules.img" bs=1024 count=$((modules_size / 1024))

          echo "==> Setting up loopback device and filesystem"
          lo_dev=$(losetup --find --show "$tmp_dir/modules.img")
          mkfs -t ext4 "$lo_dev"

          echo "==> Mounting and copying modules"
          mkdir -p "$tmp_dir/modules_img"
          mount "$lo_dev" "$tmp_dir/modules_img"
          chmod a+rw "$tmp_dir/modules_img"

          # Copy modules
          cp -rv "$MODULE_DIR"/* "$tmp_dir/modules_img/"

          echo "==> Unmounting and converting to VHDX"
          umount "$tmp_dir/modules_img"
          losetup -d "$lo_dev"
          rm -rf "$PWD/modules"

          # Convert to VHDX
          qemu-img convert -O vhdx "$tmp_dir/modules.img" modules.vhdx
          chmod 644 modules.vhdx

          # Cleanup
          rm -rf "$tmp_dir" "$PWD/modules"

      - name: Prepare and zip release assets
        if: steps.check-release.outputs.skip != 'true'
        id: prepare-assets
        run: |
          # Create artifacts directory
          mkdir -p artifacts

          # Create versioned subdirectory for kernel assets
          VERSION_DIR="artifacts/${{ steps.kernel-version.outputs.version }}"
          mkdir -p "$VERSION_DIR"

          # Move built kernel into versioned directory
          mv -v arch/x86/boot/bzImage "$VERSION_DIR/bzImage"

          if [ -f modules.vhdx ]; then
            # Move modules VHDX into versioned directory
            mv -v modules.vhdx "$VERSION_DIR/modules.vhdx"
          fi

          # Copy kernel config into versioned directory
          cp -v ${{ matrix.kconfig }} "$VERSION_DIR/config"

          # Example wslconfig file
          cat > "artifacts/example.wslconfig" << EOF
          [wsl2]
          kernel=%USERPROFILE%\\wsl\\kernels\\${{ steps.kernel-version.outputs.version }}\\bzImage
          kernelModules=%USERPROFILE%\\wsl\\kernels\\${{ steps.kernel-version.outputs.version }}\\modules.vhdx
          EOF

          # Create build summary for release description
          cat > build-summary.md << EOF
          ## Build Summary

          - **Kernel Version**: ${{ steps.kernel-version.outputs.release }}
          - **Build Date**: $(date -u '+%Y-%m-%d %H:%M:%S UTC')
          - **Git Commit**: ${{ steps.kernel-version.outputs.sha }}
          - **Git Branch**: ${{ steps.kernel-version.outputs.ref }}
          - **Workflow Run**: [${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

          ### Build Performance
          \`\`\`
          $(ccache --show-stats)
          \`\`\`

          Build time: ${{ steps.build-kernel.outputs.time_summary }}

          ### System Information
          - **CPU**: $(lscpu | grep "Model name") (${{ needs.prepare.outputs.runner-cores }} cores)
          - **Memory**: $(free -h | grep Mem | awk '{print $2}')B

          ### Assets Included
          - \`${{ steps.kernel-version.outputs.version }}/bzImage\`: Compiled kernel image
          $(if [ -f "${{ steps.kernel-version.outputs.version }}/modules.vhdx" ] || [ -f "modules.vhdx" ]; then echo "- \`${{ steps.kernel-version.outputs.version }}/modules.vhdx\`: Kernel modules in VHDX format"; fi)
          - \`${{ steps.kernel-version.outputs.version }}/config\`: Build configuration used

          ## Installation

          Use the automated PowerShell installer:

          \`\`\`powershell
          Set-ExecutionPolicy Bypass -Scope Process -Force; [System.Net.ServicePointManager]::SecurityProtocol = [System.Net.ServicePointManager]::SecurityProtocol -bor 3072; iex ((New-Object System.Net.WebClient).DownloadString('https://raw.githubusercontent.com/${{ github.repository }}/ci/Install-WSL2Kernel.ps1'))
          \`\`\`

          Or download and extract the zip file manually to \`%USERPROFILE%\\wsl\\kernels\` and update your \`.wslconfig\`.
          EOF

          # Create build info for the zip (kept at the root of the archive)
          cat > artifacts/build-info.txt << EOF
          Build Date: $(date -u '+%Y-%m-%d %H:%M:%S UTC')
          Kernel Version: ${{ steps.kernel-version.outputs.release }}
          Git Commit: ${{ steps.kernel-version.outputs.sha }}
          Git Ref: ${{ steps.kernel-version.outputs.ref }}
          Workflow Run: ${{ github.run_number }}
          Workflow URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          
          System Info:
          CPU: $(lscpu | grep "Model name") (${{ needs.prepare.outputs.runner-cores }} cores)
          Memory: $(free -h | grep Mem | awk '{print $2}')B

          ccache Stats:
          $(ccache --show-stats --verbose)

          ccache Debug Log (last 20 lines):
          $(tail -n 20 .cache/ccache.log 2>/dev/null || echo "No debug log available")
          EOF

          # List artifacts and versioned directory
          ls -la artifacts/
          ls -la "$VERSION_DIR" || true

          # Create zip file with build-info.txt at root and versioned directory inside
          zip_file="wsl2-kernel-${{ steps.kernel-version.outputs.version }}.zip"
          (cd artifacts && zip -r "../${zip_file}" build-info.txt "${{ steps.kernel-version.outputs.version }}")

          # List what we created
          echo "==> Created zip file:"
          ls -la "$zip_file"
          echo "==> Zip contents:"
          unzip -l "$zip_file"
          
          echo "zip_file=${zip_file}" >> $GITHUB_OUTPUT

          # Cleanup to save space on the runner
          rm -rf artifacts/

      - name: Checkout own repository for release
        if: steps.check-release.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          path: release-repo

      - name: Create kernel version release
        if: steps.check-release.outputs.skip != 'true'
        id: create-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd release-repo
          
          RELEASE_TAG="${{ steps.kernel-version.outputs.version }}"
          RELEASE_NAME="linux-msft-wsl-${{ steps.kernel-version.outputs.version }}"
          
          echo "==> Creating release: $RELEASE_NAME with tag: $RELEASE_TAG"
          
          # Check if release already exists and delete it if it does
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "==> Release $RELEASE_TAG already exists, deleting it first"
            gh release delete "$RELEASE_TAG" --yes
            echo "==> Delete git tag"
            git tag -d "$RELEASE_TAG" || true
            git push origin --delete "$RELEASE_TAG" || true
          fi
          
          # Create new release with build summary as description
          gh release create "$RELEASE_TAG" ${{ steps.verify-config.outputs.prerelease == 'true' && '--prerelease' || '' }} \
            "../${{ steps.prepare-assets.outputs.zip_file }}" \
            --title "$RELEASE_NAME" \
            --notes-file "../build-summary.md"
          
          echo "==> Release created successfully"
          echo "release_tag=$RELEASE_TAG" >> $GITHUB_OUTPUT
          echo "release_name=$RELEASE_NAME" >> $GITHUB_OUTPUT
          
          # Cleanup release zip
          rm -f "../${{ steps.prepare-assets.outputs.zip_file }}"

      - name: Build summary
        if: steps.check-release.outputs.skip != 'true'
        run: |
          echo "## Build Summary ${{ steps.kernel-version.outputs.release }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Kernel Version**: ${{ steps.kernel-version.outputs.release }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Build Date**: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ steps.kernel-version.outputs.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ steps.kernel-version.outputs.ref }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Release**: [${{ steps.create-release.outputs.release_name }}](https://github.com/${{ github.repository }}/releases/tag/${{ steps.create-release.outputs.release_tag }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Build Performance" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          ccache --show-stats >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "Build time: ${{ steps.build-kernel.outputs.time_summary }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Release Asset" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ steps.prepare-assets.outputs.zip_file }}\`: Complete kernel package containing:" >> $GITHUB_STEP_SUMMARY
          echo "  - \`${{ steps.kernel-version.outputs.version }}/bzImage\`: Compiled kernel image" >> $GITHUB_STEP_SUMMARY
          if [ -f "artifacts/${{ steps.kernel-version.outputs.version }}/modules.vhdx" ]; then
            echo "  - \`${{ steps.kernel-version.outputs.version }}/modules.vhdx\`: Kernel modules in VHDX format" >> $GITHUB_STEP_SUMMARY
          fi
          echo "  - \`${{ steps.kernel-version.outputs.version }}/config\`: Build configuration used" >> $GITHUB_STEP_SUMMARY
          echo "  - \`build-info.txt\`: Build metadata" >> $GITHUB_STEP_SUMMARY
          echo "## Installation command" >> $GITHUB_STEP_SUMMARY
          echo '```powershell' >> $GITHUB_STEP_SUMMARY
          echo 'Set-ExecutionPolicy Bypass -Scope Process -Force; [System.Net.ServicePointManager]::SecurityProtocol = [System.Net.ServicePointManager]::SecurityProtocol -bor 3072; iex ((New-Object System.Net.WebClient).DownloadString('"'https://raw.githubusercontent.com/${{ github.repository }}/ci/Install-WSL2Kernel.ps1'"'))' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          rm -rf *
